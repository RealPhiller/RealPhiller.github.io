# Hosts Firebase's sign-in helper on realphiller.github.io so Google sign-in
# runs on the same site as the TUBC 2027 tracker (fixes "missing initial state"
# on iPhone). Re-fetches the helper weekly so it stays current.
name: Sign-in helper

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 20 * * 0"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Fetch Firebase auth helper files
        run: |
          set -euo pipefail
          SRC=https://tubc-2027.firebaseapp.com
          mkdir -p _site/__/auth
          curl -fsSL "$SRC/__/auth/handler"        -o _site/__/auth/handler.html
          curl -fsSL "$SRC/__/auth/handler.js"     -o _site/__/auth/handler.js
          curl -fsSL "$SRC/__/auth/experiments.js" -o _site/__/auth/experiments.js
          curl -fsSL "$SRC/__/auth/iframe"         -o _site/__/auth/iframe.html
          curl -fsSL "$SRC/__/auth/iframe.js"      -o _site/__/auth/iframe.js
          printf '<!doctype html><meta charset="utf-8"><title>TUBC 2027</title><meta http-equiv="refresh" content="0;url=/tubc-2027/"><a href="/tubc-2027/">TUBC 2027 Tracker</a>\n' > _site/index.html
          touch _site/.nojekyll
          ls -la _site/__/auth
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
